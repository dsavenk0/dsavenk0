<svg width="100%" height="142" viewBox="0 0 760 142" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header { font: 700 15px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; fill: #f5f5f7; letter-spacing: -0.2px; }
    .lang-name { font: 600 12.5px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; fill: #e6edf3; }
    .lang-pct { font: 500 12px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #8b949e; }
    .card-bg { fill: #1d1f23; stroke: #313337; stroke-width: 1px; rx: 12px; }
  </style>
  <rect width="760" height="142" class="card-bg" />
  <text x="30" y="34" class="header">Most Used Languages</text>
  <!-- Progress Bar -->
  <mask id="bar-mask">
    <rect x="30" y="52" width="700" height="8" rx="4" fill="white" />
  </mask>
  <g mask="url(#bar-mask)">
    <rect x="30.00" y="52" width="348.18" height="8" fill="#3178c6" />
    <rect x="377.58" y="52" width="154.12" height="8" fill="#00ADD8" />
    <rect x="531.10" y="52" width="75.60" height="8" fill="#3572A5" />
    <rect x="606.10" y="52" width="36.02" height="8" fill="#F05138" />
    <rect x="641.52" y="52" width="28.58" height="8" fill="#336790" />
    <rect x="669.50" y="52" width="18.34" height="8" fill="#89e051" />
    <rect x="687.23" y="52" width="16.65" height="8" fill="#555555" />
    <rect x="703.29" y="52" width="12.69" height="8" fill="#563d7c" />
  </g>
  <!-- 4 Columns x 2 Rows -->
  <circle cx="35" cy="84" r="4.5" fill="#3178c6" />
  <text x="46" y="88" class="lang-name">TypeScript <tspan class="lang-pct">49.65%</tspan></text>
  <circle cx="225" cy="84" r="4.5" fill="#00ADD8" />
  <text x="236" y="88" class="lang-name">Go <tspan class="lang-pct">21.93%</tspan></text>
  <circle cx="415" cy="84" r="4.5" fill="#3572A5" />
  <text x="426" y="88" class="lang-name">Python <tspan class="lang-pct">10.71%</tspan></text>
  <circle cx="595" cy="84" r="4.5" fill="#F05138" />
  <text x="606" y="88" class="lang-name">Swift <tspan class="lang-pct">5.06%</tspan></text>
  <circle cx="35" cy="111" r="4.5" fill="#336790" />
  <text x="46" y="115" class="lang-name">PLpgSQL <tspan class="lang-pct">4.00%</tspan></text>
  <circle cx="225" cy="111" r="4.5" fill="#89e051" />
  <text x="236" y="115" class="lang-name">Shell <tspan class="lang-pct">2.53%</tspan></text>
  <circle cx="415" cy="111" r="4.5" fill="#555555" />
  <text x="426" y="115" class="lang-name">C <tspan class="lang-pct">2.29%</tspan></text>
  <circle cx="595" cy="111" r="4.5" fill="#563d7c" />
  <text x="606" y="115" class="lang-name">CSS <tspan class="lang-pct">1.73%</tspan></text>
</svg>
